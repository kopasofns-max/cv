name = "strategy-api"
main = "worker.js"
compatibility_date = "2026-11-24"

[vars]
# После подключения домена GitHub Pages замените * на точный origin, например:
# ALLOWED_ORIGIN = "https://username.github.io"
ALLOWED_ORIGIN = "*"
GEMINI_MODEL = "gemini-3.6-flash"

[[ratelimits]]
name = "STRATEGY_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
